<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florivy Bakes</title>
    
    <link rel="icon" href="../Asset/Images/logo/logo.jpg">
    <link rel="stylesheet" href="../Asset/Css/style.css"/>
    <script src="../Asset/Js/script.js"></script>
    <script src="../Asset/Js/autoplay.js"></script>
</head>
<body>
    <div id="container">
        <div id="header" class="header">
            <div class="logo">
                <a href="index.html"><img src="../Asset/Images/logo/logo.jpg" alt="florivybakes_logo"/>
                <h3>Florivy Bakes</h3></a>
            </div>

            <div class="header-links">
                <ul>
                    <a href="index.html"><li>Home</li></a>
                    <a href="menu.html"><li>Menu</li></a>
                </ul>
            </div>
        </div>

        <div class="main-container">
            <div class="main">  
                <div class="main-img"><img src="../Asset/Images/misc/Cover1.png" alt=""></div>
                <div class="main-title">
                    <p>Florivy<br>Bakes</p>
                </div>
            </div>

            <div class="bestseller">
                <div class="bestseller-backdrop"></div>
                <div class="bestseller-img"><img src="../Asset/Images/misc/Cover2.png" alt="MOSTWANTEDCOOKIE"></div>
                <div class="bestseller-title">
                    <p>The<br><span>Crowd</span><br> Favorite</p>
                </div>
                <div class="bestseller-backdrop-bottom"></div>
            </div>

            <div class="feedback-container">
                <div class="feedback-title">
                    <h2>Feedback</h2>
                </div>
                <div class="feedback-photo"><img src="../Asset/Images/misc/placeholder.png" alt="feedback"></div>
                <div id="feedback" class="feedback">   
                </div>
            </div>

            <div class="owner">
                <div class="backdrop-top"></div>
                <div class="owner-img">
                    <img src="../Asset/Images/misc/Owners.jpg" alt="owner_name">
                </div>

                <div class="owner-description">
                    <h1>Meet</h1>
                    <p>Meet Kobe & Micah, the proud owners of Florivy Bakes!</p>
                    <a href="example.link">Check out their story</a>
                </div>
                <div class="backdrop-bottom"> </div>
            </div>

            <div class="menu-preview">
            </div>
        </div>

        <div id="spotify" class="spotify-playlist">
            <iframe 
                id="spotify-iframe"
                data-testid="embed-iframe" 
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/playlist/7ahynoK1xfrwTLpoNzEPsa?utm_source=generator&si=8e34de5d3d5e4297" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>
        
    </div>

    <footer id="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <img src="../Asset/Images/logo/logo.jpg" alt="florivybakes_logo"/>
                <h3>Florivy Bakes</h3>
            </div>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
            </div>

            <div class="footer-socials">
                <a href="#" target="_blank">Instagram</a>
                <a href="#" target="_blank">Facebook</a>
                <a href="mailto:hello@florivybakes.com">Email</a>
            </div>
        </div>

        <p class="footer-copyright">&copy; 2026 Florivy Bakes. All rights reserved.</p>
    </footer>
</body>
</html>
